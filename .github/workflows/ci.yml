name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Credencial sintética de laboratório, a mesma de docker-compose.yml; não é segredo.
          POSTGRES_USER: ft
          POSTGRES_PASSWORD: ft_local_dev_only
          POSTGRES_DB: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U ft"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FT_TEST_ADMIN_CONNECTION: Host=127.0.0.1;Port=15432;Database=postgres;Username=ft;Password=ft_local_dev_only
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet msbuild FinancialTransactions.sln -target:Restore -warnaserror

      - name: Build
        run: dotnet build FinancialTransactions.sln -c Release --no-restore --no-incremental -warnaserror

      - name: Test
        run: dotnet test FinancialTransactions.sln -c Release --no-build --settings tests/vstest.runsettings
